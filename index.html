<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小熊英语小屋 · 野餐任务</title><style>body{margin:0;background:#f7f0df;color:#173b4f;font-family:system-ui,sans-serif}main{max-width:780px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.badge{background:#f2c14e;border:3px solid #173b4f;border-radius:99px;padding:8px 14px;font-weight:700}.mission{background:#fff9ed;border:3px solid #173b4f;border-radius:18px;padding:14px 18px;margin:14px 0;font-size:20px}.stage{background:#b9d9ac;border:6px solid #d45b45;border-radius:28px;padding:20px;min-height:430px;box-shadow:0 8px #173b4f}.bear{font-size:82px;text-align:center}.bubble{background:#fff9ed;border-radius:20px;padding:16px;font-size:24px;text-align:center;min-height:34px}.items{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px}.item{font-size:44px;background:#fff9ed;border:3px solid #173b4f;border-radius:18px;padding:10px 16px;cursor:pointer}.item small{display:block;font-size:14px;font-weight:700}.controls{text-align:center;margin-top:18px}.mic{background:#d45b45;color:#fff;border:0;border-radius:50%;width:78px;height:78px;font-size:32px;cursor:pointer}.status{text-align:center;font-size:16px;margin-top:10px}.progress{display:flex;gap:6px;margin-top:12px}.dot{height:10px;flex:1;background:#d8cbb3;border-radius:8px}.dot.on{background:#4d9560}</style></head><body><main><div class="top"><h1>小熊的野餐任务</h1><div id="step" class="badge">任务 1 / 4</div></div><div class="mission" id="mission">🎒 帮小熊准备野餐：先选一样食物放进篮子。</div><div class="progress"><i class="dot on"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><section class="stage"><div class="bear" id="bear">🐻</div><div id="bubble" class="bubble">Can you help me pack a picnic?</div><div id="items" class="items"></div></section><div class="controls"><button id="mic" class="mic" aria-label="说英语">🎙️</button><div id="status" class="status">点击正确物品，或按麦克风说英语</div></div></main><script>const mission=document.querySelector('#mission'),bubble=document.querySelector('#bubble'),items=document.querySelector('#items'),status=document.querySelector('#status'),step=document.querySelector('#step'),bear=document.querySelector('#bear'),dots=[...document.querySelectorAll('.dot')];let n=0;const levels=[{text:'🎒 帮小熊准备野餐：先选一样食物放进篮子。',say:'Let’s take an apple.',choices:[['🍎','apple'],['🧸','toy'],['🧦','sock']]},{text:'🧺 还需要一条野餐毯，找一找。',say:'Let’s take the blanket.',choices:[['🧺','blanket'],['🍌','banana'],['🧢','hat']]},{text:'🌧️ 天空下雨了！告诉小熊为什么要带雨伞。',say:'We need an umbrella because it is raining.',choices:[['☂️','umbrella'],['☀️','sun'],['🕶️','glasses']]},{text:'🍓 野餐完成！用 First… then… 说说你做了什么。',say:'First we pack, then we picnic.',choices:[['✅','finish']]}];function speak(t){bubble.textContent=t;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.84;speechSynthesis.speak(u)}function render(){const l=levels[n];mission.textContent=l.text;step.textContent=`任务 ${n+1} / 4`;dots.forEach((d,i)=>d.classList.toggle('on',i<=n));items.innerHTML='';l.choices.forEach(([icon,word])=>{const b=document.createElement('button');b.className='item';b.innerHTML=`${icon}<small>${word}</small>`;b.onclick=()=>choose(word);items.appendChild(b)});speak(n===0?'Can you help me pack a picnic?':l.say)}function choose(word){const target=['apple','blanket','umbrella','finish'][n];if(word!==target){status.textContent='再听听小熊的任务提示。';speak('Try again. Listen to the mission.');return}if(n===3){speak('You did it! First we pack, then we picnic!');status.textContent='🎉 野餐完成！你帮助小熊完成了四个英语任务。';bear.textContent='🐻🧺🌈';items.innerHTML='<button class="item" onclick="location.reload()">🔁<small>再玩一次</small></button>';return}status.textContent='✅ 完成！小熊知道下一步了。';bear.textContent=n===2?'🐻☂️':'🐻🧺';n++;setTimeout(render,700)}document.querySelector('#mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){status.textContent='当前浏览器不支持语音，请点击任务里的物品。';return}const r=new R();r.lang='en-US';r.onstart=()=>status.textContent='小熊在听你说…';r.onresult=e=>{const t=e.results[0][0].transcript.toLowerCase();status.textContent='你说：'+t;if(n===0&&/apple|food|take/.test(t))choose('apple');else if(n===1&&/blanket/.test(t))choose('blanket');else if(n===2&&/umbrella|rain|because/.test(t))choose('umbrella');else if(n===3&&/first|then|pack/.test(t))choose('finish');else speak(levels[n].say)};r.onerror=()=>status.textContent='没关系，再说一次，或者点击正确物品。';r.start()};render()</script></body></html>
