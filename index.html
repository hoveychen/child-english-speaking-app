<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小熊英语小屋</title><style>body{margin:0;background:#f7f0df;color:#173b4f;font-family:Georgia,serif}main{max-width:760px;margin:auto;padding:24px}.stage{background:#d9ead0;border:6px solid #d45b45;border-radius:28px;padding:24px;min-height:420px;box-shadow:0 8px #173b4f}.bear{font-size:90px;text-align:center}.bubble{background:#fff9ed;border-radius:20px;padding:18px;font-size:24px;text-align:center}.items{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}.item{font-size:48px;background:#fff9ed;border:3px solid #173b4f;border-radius:18px;padding:12px;cursor:pointer}.controls{text-align:center;margin-top:20px}.mic{background:#d45b45;color:#fff;border:0;border-radius:50%;width:82px;height:82px;font-size:34px;cursor:pointer}.small{font:16px system-ui;margin-top:12px;text-align:center}</style></head><body><main><h1>小熊的野餐日</h1><section class="stage"><div class="bear">🐻</div><div id="bubble" class="bubble">What should we bring?</div><div id="items" class="items"><button class="item" data-word="apple">🍎</button><button class="item" data-word="banana">🍌</button><button class="item" data-word="blanket">🧺</button><button class="item" data-word="umbrella">☂️</button></div></section><div class="controls"><button id="mic" class="mic">🎙️</button><div id="status" class="small">点物品，或按麦克风说英语</div></div></main><script>const bubble=document.querySelector('#bubble'),status=document.querySelector('#status');let chosen=[];function speak(t){bubble.textContent=t; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{const w=b.dataset.word;chosen.push(w); if(w==='umbrella'){speak('We need an umbrella because it is raining!');status.textContent='太棒了！你发现了下雨的线索。'}else{speak('Great! Let’s take the '+w+'.');status.textContent='继续选择野餐用品，试试说：Let’s take '+w+'.'}});document.querySelector('#mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){status.textContent='当前浏览器不支持语音，请点击物品继续。';return}const r=new R();r.lang='en-US';r.onstart=()=>status.textContent='我在听…';r.onresult=async e=>{const text=e.results[0][0].transcript;status.textContent='你说：'+text;const out=await fetch('/api/turn',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})}).then(x=>x.json());speak(out.reply_script);if(out.next_action==='support')status.textContent='跟着小熊说：Let’s take an umbrella.'};r.onerror=()=>status.textContent='没关系，我们再试一次，或点击物品。';r.start()};speak('What should we bring?');</script></body></html>
